name: Windows portable engine

on:
  push:
  pull_request:

jobs:
  windows-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable C++ targets
        run: cmake --preset windows-ninja
      - name: Build portable C++ targets
        run: cmake --build --preset windows-ninja-release --parallel
      - name: Run deterministic tests
        run: ctest --preset windows-ninja-tests
      - name: Generate and process synthetic RAW burst
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-output | Out-Null
          .\build\win\gcam_cli.exe generate-synthetic ci-output\burst --frames 8 --width 128 --height 96
          .\build\win\gcam_cli.exe process ci-output\burst --profile config\gcam_natural.xml --output ci-output\result.ppm --diagnostics ci-output\processing.json
      - name: Upload benchmark diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: windows-benchmark-diagnostics
          path: ci-output/
